<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mwijay Tech Vault & Voice</title>
  <style>
    :root {
      --lg-bg-color: rgba(255, 255, 255, 0.08);
      --lg-highlight: rgba(255, 255, 255, 0.15);
      --lg-text: #ffffff;
      --lg-red: #fb4268;
      --lg-violet: #818cf8;
      --lg-indigo: #6366f1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 380px;
      min-height: 550px;
      max-height: 600px;
      background: #0b0c15;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border-radius: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.15), inset 0 0 5px rgba(255, 255, 255, 0.08), 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Glass layer backgrounds */
    .glass-backdrop {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.15), transparent 60%),
                  radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.1), transparent 60%);
      z-index: 0;
      pointer-events: none;
    }

    .header {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px) saturate(120%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--lg-indigo), #ec4899);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35), inset 1px 1px 0 rgba(255, 255, 255, 0.3);
    }

    .logo-text {
      font-size: 12px;
      font-weight: 800;
      background: linear-gradient(135deg, #a5b4fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .logo-sub {
      font-size: 8px;
      color: #94a3b8;
      margin-top: -1px;
    }

    .open-app-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      border-radius: 10px;
      padding: 5px 9px;
      font-size: 9px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.1);
    }

    .open-app-btn:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.4);
      color: #fff;
      transform: translateY(-1px);
    }

    .auth-bar {
      position: relative;
      z-index: 10;
      padding: 8px 14px;
      background: rgba(9, 10, 16, 0.5);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #94a3b8;
    }

    .auth-info {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .auth-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .auth-dot.online { background: #10b981; box-shadow: 0 0 6px rgba(16,185,129,0.6); }
    .auth-dot.offline { background: #f59e0b; }

    .sync-badge {
      font-size: 8px;
      background: rgba(99, 102, 241, 0.1);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.25);
      padding: 1.5px 6px;
      border-radius: 8px;
      font-weight: 700;
    }

    .auth-toggle-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: #a5b4fc;
      border-radius: 6px;
      padding: 2.5px 7px;
      font-size: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .auth-toggle-btn:hover {
      background: rgba(99,102,241,0.2);
      color: #fff;
    }

    .nav-tabs {
      position: relative;
      z-index: 10;
      display: flex;
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 5px;
      gap: 5px;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      font-size: 10px;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tab-content {
      position: relative;
      z-index: 10;
      display: none;
      padding: 14px;
      flex: 1;
      overflow-y: auto;
    }

    .tab-content.active {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Input & Textarea Elements (Sleek Specular Glow) */
    .transcript-area, .tts-input, .form-input, .form-select {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 11px;
      color: #f1f5f9;
      resize: none;
      outline: none;
      font-family: inherit;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }

    .transcript-area:focus, .tts-input:focus, .form-input:focus, .form-select:focus {
      border-color: rgba(99, 102, 241, 0.4);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 10px rgba(99, 102, 241, 0.15);
    }

    /* Category selectors */
    .lang-selector, .filter-chips, .engine-selector {
      display: flex;
      gap: 5px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 3px;
      border-radius: 12px;
    }

    .lang-btn, .chip, .engine-chip {
      flex: 1;
      padding: 6px 4px;
      border-radius: 9px;
      font-size: 9px;
      font-weight: 700;
      color: #94a3b8;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active, .chip.active, .engine-chip.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Kinasa Sauti (Mic Container & Pulsing Visualizer) */
    .mic-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 0;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, 0.05);
    }

    .mic-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--lg-indigo), #ec4899);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4), inset 1px 1px 0 rgba(255, 255, 255, 0.35);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .mic-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5), inset 1px 1px 0 rgba(255, 255, 255, 0.45);
    }

    /* Record Mode Spinning Vinyl Anim */
    .mic-btn.recording {
      animation: vinyl-spin 3s linear infinite;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
      background: black;
    }

    @keyframes vinyl-spin {
      from { transform: rotate(0deg) scale(1.03); }
      to { transform: rotate(360deg) scale(1.03); }
    }

    .mic-status {
      font-size: 9px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .action-row {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .action-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      transform: translateY(-1px);
    }

    .action-btn.primary {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.4);
      color: #a5b4fc;
    }

    .action-btn.primary:hover:not(:disabled) {
      background: rgba(99, 102, 241, 0.35);
    }

    .action-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Vault Lists & Card Items */
    .vault-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .vault-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 10px 12px;
      transition: all 0.2s;
      box-shadow: inset 1px 1px 0 rgba(255,255,255,0.05);
    }

    .vault-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateX(2px);
    }

    /* Vault Forms */
    .vault-form-modal {
      background: rgba(15, 17, 28, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-label {
      font-size: 8px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-actions {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    /* Footer styling */
    .footer {
      position: relative;
      z-index: 10;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(9, 10, 16, 0.6);
      margin-top: auto;
    }

    .footer-text { font-size: 8.5px; color: #64748b; font-weight: 600; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 185, 129, 0.95);
      color: white;
      font-weight: 800;
      font-size: 9px;
      padding: 6px 14px;
      border-radius: 20px;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
      display: none;
    }

    .toast.show { display: block; }

    /* ========================================== */
    /*   DIFFERENT DESIGN MINI MODE (Island pill)  */
    /* ========================================== */
    body.ext-mini-mode {
      min-height: 135px !important;
      max-height: 135px !important;
      background: rgba(11, 12, 21, 0.94) !important;
      border-radius: 2rem !important;
      border: 1px solid rgba(99, 102, 241, 0.4) !important;
      backdrop-filter: blur(24px) saturate(140%) !important;
      padding: 8px !important;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 1px 1px 0 rgba(255,255,255,0.2);
    }

    body.ext-mini-mode .header {
      background: transparent !important;
      border-bottom: none !important;
      padding: 2px 6px !important;
      backdrop-filter: none !important;
      box-shadow: none !important;
    }

    body.ext-mini-mode .header .logo-sub,
    body.ext-mini-mode .auth-bar,
    body.ext-mini-mode .nav-tabs,
    body.ext-mini-mode .footer {
      display: none !important;
    }

    body.ext-mini-mode .tab-content {
      padding: 0 4px !important;
    }

    body.ext-mini-mode .mic-container {
      display: none !important;
    }

    body.ext-mini-mode .transcript-area {
      height: 38px !important;
      border-radius: 12px !important;
      padding: 6px 10px !important;
      font-size: 10.5px !important;
    }

    body.ext-mini-mode .action-row {
      margin-top: 6px !important;
      gap: 4px !important;
    }

    body.ext-mini-mode .action-btn {
      padding: 6px 8px !important;
      font-size: 9px !important;
      border-radius: 10px !important;
    }

    body.ext-mini-mode #toggleTtsCollapseBtn {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Liquid glass backdrop lighting effects -->
  <div class="glass-backdrop"></div>

  <!-- Header -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">🎙️</div>
      <div>
        <div class="logo-text">MVS</div>
        <div class="logo-sub">Voice Studio & Vault</div>
      </div>
    </div>
    <div style="display: flex; gap: 4px;">
      <button class="open-app-btn" id="toggleExtMiniBtn" title="Toggle Compact MVS Mode">
        MVS 🗗
      </button>
      <button class="open-app-btn" id="openSidePanelBtn" title="Open persistent Chrome Sidebar">
        Sidebar 📌
      </button>
      <button class="open-app-btn" id="openAppBtn">
        Web App ↗
      </button>
    </div>
  </div>

  <!-- Auth Bar -->
  <div class="auth-bar">
    <div class="auth-info">
      <div class="auth-dot online" id="authDot"></div>
      <span id="authText">Davie Mwijay</span>
    </div>
    <div style="display: flex; gap: 4px; align-items: center;">
      <span class="sync-badge" id="syncBadge">☁️ Synced</span>
      <button class="auth-toggle-btn" id="toggleAuthModalBtn">🔑 Login</button>
    </div>
  </div>

  <!-- Auth Modal Form -->
  <div class="vault-form-modal" id="authModal">
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" id="authEmail" class="form-input" placeholder="user@mwijaytech.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" id="authPassword" class="form-input" placeholder="Enter account password..." />
    </div>
    <div class="form-actions">
      <button class="action-btn" id="closeAuthBtn">Close</button>
      <button class="action-btn primary" id="doLoginBtn">Sign In ✓</button>
    </div>
  </div>

  <!-- Tab Navigation buttons -->
  <div class="nav-tabs">
    <button class="tab-btn active" data-tab="voiceTab">
      🎙️ Voice Studio
    </button>
    <button class="tab-btn" data-tab="vaultTab">
      🔐 Vault
    </button>
    <button class="tab-btn" data-tab="clipsTab">
      📋 Web Clips
    </button>
  </div>

  <!-- TAB 1: VAULT & PASSWORDS -->
  <div class="tab-content" id="vaultTab">
    <div class="add-vault-header">
      <span class="logo-text" style="font-size: 11px;">Saved Secrets</span>
      <button class="add-btn" id="toggleAddFormBtn">+ Add Secret</button>
    </div>

    <!-- Vault Add Form -->
    <div class="vault-form-modal" id="vaultFormModal">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select id="formCategory" class="form-select">
          <option value="password">🔑 Login Password</option>
          <option value="api-key">⚡ API Key / Secret Token</option>
          <option value="card">💳 Card / Payment</option>
          <option value="note">📝 Encrypted Note</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Title / Site Name</label>
        <input type="text" id="formTitle" class="form-input" placeholder="e.g. OpenAI API Key, GitHub..." />
      </div>

      <div class="form-group">
        <label class="form-label">Username / Key Identifier</label>
        <input type="text" id="formNotes" class="form-input" placeholder="e.g. user@email.com or sk-..." />
      </div>

      <div class="form-group">
        <label class="form-label">Secret Value / Password</label>
        <input type="password" id="formValue" class="form-input" placeholder="Enter password or secret..." />
      </div>

      <div class="form-actions">
        <button class="action-btn" id="cancelFormBtn">Cancel</button>
        <button class="action-btn primary" id="saveFormBtn">Save Secret ✓</button>
      </div>
    </div>

    <div style="position: relative; margin-bottom: 8px;">
      <input type="text" id="vaultSearch" class="form-input" placeholder="Search keys, passwords..." style="padding-left: 28px; border-radius: 12px;" />
      <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 10px;">🔍</span>
    </div>

    <!-- Category Filter Chips -->
    <div class="filter-chips">
      <button class="chip active" data-cat="all">All</button>
      <button class="chip" data-cat="password">Passwords</button>
      <button class="chip" data-cat="api-key">API Keys</button>
      <button class="chip" data-cat="note">Notes</button>
    </div>

    <!-- Vault Item List Container -->
    <div class="vault-list" id="vaultList">
      <div class="empty-state" style="text-align: center; padding: 20px 0; opacity: 0.6;">
        <p>No secrets stored yet.</p>
      </div>
    </div>
  </div>

  <!-- TAB 2: VOICE STUDIO & TTS (Default Open) -->
  <div class="tab-content active" id="voiceTab">
    <!-- Dictation Section -->
    <div class="lang-selector">
      <button class="lang-btn" data-lang="sw-KE">🇹🇿 Swahili</button>
      <button class="lang-btn active" data-lang="auto">🌍 Auto</button>
      <button class="lang-btn" data-lang="en-US">🇺🇸 English</button>
    </div>

    <!-- Kinasa Sauti -->
    <div class="mic-container">
      <button class="mic-btn" id="micBtn" title="Click to speak">🎤</button>
      <p class="mic-status" id="micStatus">Ready to dictate</p>
    </div>

    <!-- Inline Editable Text area -->
    <textarea class="transcript-area" id="transcriptArea" placeholder="Transcript appears here..." rows="3"></textarea>

    <!-- STT Action Bar -->
    <div class="action-row">
      <button class="action-btn" id="insertBtn" disabled>📥 Insert</button>
      <button class="action-btn" id="copyBtn" disabled>📋 Copy</button>
      <button class="action-btn primary" id="saveVaultBtn" disabled>🔐 Save Vault</button>
      <button class="action-btn" id="toggleTtsCollapseBtn" style="flex: 0 1 auto; padding: 6px 10px;">🔊 TTS</button>
    </div>

    <!-- Collapsible Text-to-Speech Settings -->
    <div id="ttsCollapsibleSection" style="display: none; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">
      
      <div class="engine-selector">
        <button class="engine-chip active" data-engine="elevenlabs">ElevenLabs</button>
        <button class="engine-chip" data-engine="puter">Puter.js</button>
        <button class="engine-chip" data-engine="browser">Browser Native</button>
      </div>

      <div class="form-group">
        <select id="ttsVoiceSelect" class="form-select" style="padding: 6px 10px;">
          <option value="21m00Tcm4TlvDq8ikWAM">Rachel (ElevenLabs)</option>
          <option value="AZnzlk1XvdvUeBnXmlld">Domi (ElevenLabs)</option>
          <option value="pNInz6obpgDQGcFmaJgB">Adam (ElevenLabs)</option>
          <option value="puter-sw">Puter.js Swahili Engine</option>
        </select>
      </div>

      <textarea class="tts-input" id="ttsInput" placeholder="Enter text to speak..." rows="2"></textarea>

      <!-- Speed Control -->
      <div class="speed-slider-row">
        <span class="speed-label">Speed: <span id="speedVal" style="color:var(--lg-violet);">1.0x</span></span>
        <input type="range" id="ttsSpeedRange" class="speed-range" min="0.5" max="2.0" step="0.1" value="1.0" />
      </div>

      <!-- TTS Speak Controls -->
      <div class="action-row">
        <button class="action-btn" id="readSelectedBtn">📖 Read Selection</button>
        <button class="action-btn primary" id="speakBtn">▶ Speak</button>
        <button class="action-btn" id="stopSpeakBtn">⏹ Stop</button>
        <button class="action-btn" id="downloadTtsBtn" title="Download MP3">💾 MP3</button>
      </div>
    </div>
  </div>

  <!-- TAB 3: WEB CLIPPINGS -->
  <div class="tab-content" id="clipsTab">
    <div class="add-vault-header">
      <span class="logo-text" style="font-size: 11px;">Saved Clips</span>
    </div>
    <div class="vault-list" id="clipsList">
      <div class="empty-state" style="text-align: center; padding: 20px 0; opacity: 0.6;">
        <p>No web clippings stored yet.</p>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-text">MVS OS v1.2.0</span>
    <span class="footer-text">Hotkey: <span class="kbd">Alt+M</span></span>
  </div>

  <!-- Micro-Toast Alert -->
  <div class="toast" id="toast">✅ Action Completed</div>

  <!-- SVGLens Blur Filter Elements -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
    <filter id="lensFilter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox">
      <feComponentTransfer in="SourceAlpha" result="alpha">
        <feFuncA type="identity" />
      </feComponentTransfer>
      <feGaussianBlur in="alpha" stdDeviation="50" result="blur" />
      <feDisplacementMap in="SourceGraphic" in2="blur" scale="50" xChannelSelector="A" yChannelSelector="A" />
    </filter>
  </svg>
